# NAKABANDI world simulator configuration (DOC 3 M1; keys from DOC 2 Appendix A — Simulator
# Parameter Priors). Track B fills the values (DOC 4 §4.1b). Every value is a PRIOR swept in
# the evaluation; never presented as calibrated. Keys are frozen (LC-7 equivalent for sim).
#
# GOLDEN CONFIG: seed=42, 3 days, ~600 complaints/day, 6 clusters.
# All values verified inside Appendix A priors (see Learnings).

seed: 42

world:
  days: 7
  n_clusters: 20

load:
  complaints_per_day: 600  # Appendix A: default 8,000 (national); golden uses district-scale slice ~600

amounts:
  mean_paise: 9400000      # Appendix A: ~₹94,000 (2025) = 9,400,000 paise; shape: lognormal
  shape_sigma: 1.2         # lognormal sigma; heavy-tailed, assumed

network:
  layers_min: 2
  layers_max: 12
  layers_median: 4         # Appendix A: 2 to 12, median ~4
  accounts_per_cluster: 120 # demo bump: 80→120 for visually denser graphs
  bridge_rate: 0.15        # demo bump: 0.05→0.15; more shared-account bridges across clusters
  hop_visibility: 0.7      # Appendix A: assumed; 70% of deeper hops traced later

caps:
  card_atm_daily_inr: 50000      # Appendix A: 20,000–1,00,000, median ~50,000
  cardless_atm_txn_inr: 10000    # Appendix A: ~10,000 per txn
  aeps_txn_inr: 10000            # Appendix A: ~10,000 per txn
  aeps_daily_inr: 20000          # Appendix A: 10,000–50,000 daily

timing:
  # Appendix A: fast median ~15 min (range 1–60); slow component hours to a day; SWEEP 15/60/240
  mixture:
    - weight: 0.55
      component: fast
      lognormal_median_min: 15.0  # within Appendix A range 1–60
      lognormal_sigma: 0.8
    - weight: 0.45
      component: slow
      lognormal_median_min: 240.0 # ~4 h; "hours to a day"
      lognormal_sigma: 1.1

channels:
  # Appendix A: unpublished; three labelled-illustrative mixes — golden uses ATM-heavy
  mix:
    ATM: 0.65
    BRANCH: 0.20
    AGENT: 0.15

footprint:
  # Appendix A: unpublished; sweep local (one district) to dispersed (multi-state)
  locality: multi_district    # demo bump: district→multi_district for wider geographic spread
  size_per_cluster: 60        # demo bump: 40→60 for more location coverage

mule:
  lifetime_days: 30           # Appendix A: 1 to 180, median ~30

geo:
  # Real MHA-sourced state complaint shares (data/seed/state_cybercrime_weights.csv: MHA Rajya
  # Sabha USQ 1200, 30.07.2025, NCRP 2024 incident counts, normalised to these four states) —
  # supersedes the earlier MHA Lok Sabha UQ 1906 assumed split. Four demo states: UP, MH, HR, JH
  # (JH replaces RJ — data/seed/ only covers these four).
  state_weights:
    MH: 0.4060
    UP: 0.4032
    HR: 0.1580
    JH: 0.0328

kit:
  cards_per_account: 1        # Appendix A: kits typically hold one ATM card per account

noise:
  innocent_layer1_rate: 0.03  # Appendix A: assumed 2–5%; golden uses 3%

lag:
  min: 0.5
  max: 48.0                 # Appendix A: bank/police lag; range hours to days
  median: 6.0
