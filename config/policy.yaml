# NAKABANDI policy configuration (DOC 3 LC-7). Keys are FROZEN by the locked contract; values
# here are tunable and are read by Policy.load() (apps/api/src/nakabandi/shared/policy.py),
# which rejects a missing, extra or mistyped key rather than booting on a partial policy.
#
# Value provenance:
#   - Values with a "DOC3:" comment are taken verbatim from a worked example or a stated
#     default elsewhere in DOC 3 (cited by section).
#   - Every other value is a Track A starting value: DOC 3 names the key but not a number.
#     These are seeds for Track B to calibrate and sweep, the same way Appendix A treats
#     simulator priors — never presented as calibrated. See docs/state/track-a.md Learnings.

forecast:
  horizons_min: [30, 60, 120] # DOC3: M2 "horizon probabilities (30/60/120 min)"
  candidates:
    max: 200 # DOC3: M2 "candidate cap of 200"
    radius_km: 2.0
    widen_factor: 2.0
  abstain:
    min_confidence:
      district: 0.15
      cell: 0.25
      location: 0.4
  stale_residual_mass: 0.05
  novelty_threshold: 0.7 # DOC3: S4 "novelty >= policy.forecast.novelty_threshold (0.7)"
  novel_confidence_cap: 0.35
  timing:
    n0: 20
    n_min: 8

interception:
  speed_kmh:
    urban: 25
    semi_urban: 35
    rural: 45
  road_factor: 1.3
  thresholds:
    interceptable: 0.7 # DOC3: M6 "INTERCEPTABLE if p >= 0.7"
    marginal: 0.3 # DOC3: M6 "MARGINAL if p >= 0.3"
  targets: 3 # DOC3: M6 "up to policy.interception.targets, default 3"
  min_confidence_for_action: 0.3
  # First matching rule wins (interception module, a later step); must end with a catch-all.
  ladder:
    - { channel: "*", verdict: "NOT_INTERCEPTABLE", level: "NONE" }
    - { channel: "ATM", verdict: "MARGINAL", level: "L1" }
    - { channel: "BRANCH", verdict: "MARGINAL", level: "L1" }
    - { channel: "AGENT", verdict: "MARGINAL", level: "L1" }
    - { channel: "ATM", verdict: "INTERCEPTABLE", level: "L3" }
    - { channel: "BRANCH", verdict: "INTERCEPTABLE", level: "L3" }
    - { channel: "AGENT", verdict: "INTERCEPTABLE", level: "L2" }
    - { channel: "*", verdict: "*", level: "L2" } # DOC3: M6 "default rule L2"

lien:
  expiry_hours: 72
  review_hours: 24

alerting:
  floor_confidence: 0.2
  # Severity is a band of score = confidence x ln(1 + amount_paise) x max(P_interception, floor)
  # (DOC3 M4). The score is NOT a 0-1 quantity: ln(1 + paise) is 13.8 at INR 10,000 and 20.7 at
  # INR 1 crore, and P is 0.3 (marginal / the floor) or 0.7 (interceptable), so real scores run
  # from about 1.2 to 14.5. The bands below split that range so a typical alert (confidence 0.5,
  # INR 2 lakh, interceptable: 0.5 x 16.8 x 0.7 = 5.9) is HIGH, a sure one on a large amount is
  # CRITICAL, and a doubtful one on a small amount is LOW. Placeholders (see the header): recheck
  # against the score distribution the evaluation harness sees on real forecasts.
  severity_bands:
    critical: 9.0
    high: 5.0
    medium: 2.5
  budget_per_shift: 40
  shift_hours: 8
  exploration_share: 0.05
  escalate_after_min: 30
  expire_grace_min: 15
  refresh_min: 10
  dedup_window_min: 60
  review_queue:
    size: 50
  delivery:
    max_attempts: 5 # DOC3: M4 "attempts >= 5 -> dead"
    backoff_s: 5 # DOC3: M4 "5 s, 10 s, ... capped 5 min" (base of the exponential backoff)
  sms:
    max_segments: 3

outcome:
  grace_hours: 6

heatmap:
  k_threshold: 3
  potential_lookback_hours: 72
  decay_half_life_hours: 24
  amount_bands: [5000000, 20000000, 100000000] # paise: ~50k / 2L / 10L INR boundaries
  confidence_bands: [0.3, 0.6, 0.85]

# Permission matrix (DOC3 M5): "Rows and columns are policy data, not code."
access:
  permissions:
    i4c_analyst:
      [
        "VIEW_ALERTS",
        "ACKNOWLEDGE",
        "REQUEST_HOLD",
        "NOTIFY_STATION",
        "DISPATCH",
        "OVERRIDE",
        "MARK_OUTCOME",
        "CREATE_EVIDENCE",
        "VIEW_CASES",
        "VIEW_AUDIT",
        "VIEW_EVALUATION",
      ]
    state_investigator:
      [
        "VIEW_ALERTS",
        "ACKNOWLEDGE",
        "REQUEST_HOLD",
        "NOTIFY_STATION",
        "DISPATCH",
        "OVERRIDE",
        "MARK_OUTCOME",
        "CREATE_EVIDENCE",
        "VIEW_CASES",
        "VIEW_AUDIT",
        "VIEW_EVALUATION",
      ]
    district_officer:
