[project]
name = "nakabandi-api"
version = "0.0.0"
description = "NAKABANDI API: modular monolith (DOC 2 §2.6)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "nakabandi-contracts",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "fastapi>=0.121.0",
    "sqlalchemy>=2.0.44",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.1",
    "uvicorn[standard]>=0.38.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nakabandi"

[tool.uv.sources]
nakabandi-contracts = { workspace = true }
