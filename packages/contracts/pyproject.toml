[project]
name = "nakabandi-contracts"
version = "0.0.0"
description = "NAKABANDI canonical shared contracts: JSON Schemas and Pydantic models, no logic."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
